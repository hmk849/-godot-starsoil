name: Build unsigned iOS IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 90

    steps:
      - name: Download and unpack source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download --repo "${{ github.repository }}" --pattern 'godot-starsoil.zip' --dir /tmp
          mkdir -p unpack game
          unzip -q /tmp/godot-starsoil.zip -d unpack
          PROJECT=$(find unpack -type f -name project.godot -print -quit)
          test -n "$PROJECT"
          cp -R "$(dirname "$PROJECT")/." game/

          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("game/project.godot")
          s = p.read_text()
          key = "textures/vram_compression/import_etc2_astc"

          if re.search(r'(?m)^' + re.escape(key) + r'=.*$', s):
              s = re.sub(
                  r'(?m)^' + re.escape(key) + r'=.*$',
                  key + '=true', s, count=1
              )
          elif "[rendering]" in s:
              s = s.replace(
                  "[rendering]",
                  "[rendering]\n" + key + "=true", 1
              )
          else:
              s += "\n[rendering]\n" + key + "=true\n"

          p.write_text(s)
          print("已更新移动端纹理设置")
          PY

          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("game/export_presets.cfg")
          s = p.read_text()

          sections = list(re.finditer(r'(?m)^\[preset\.(\d+)\]\s*$', s))
          target = None

          for i, match in enumerate(sections):
              end = sections[i + 1].start() if i + 1 < len(sections) else len(s)
              block = s[match.start():end]
              if re.search(r'(?m)^name="iOS"\s*$', block):
                  target = (match.group(1), match.start(), end)
                  break

          if target is None:
              raise SystemExit("ERROR: 找不到名称为 iOS 的导出预设")

          index, start, end = target
          options_header = f"[preset.{index}.options]"

          if options_header not in s:
              raise SystemExit("ERROR: 找不到 iOS 导出选项区")

          start_options = s.index(options_header, start, end)
          next_section = s.find("\n[preset.", start_options + len(options_header))
          if next_section == -1:
              next_section = len(s)

          block = s[start_options:next_section]

          team_key = "application/app_store_team_id"
          team_line = team_key + '="ABCDE12XYZ"'

          if re.search(r'(?m)^' + re.escape(team_key) + r'=.*$', block):
              block = re.sub(
                  r'(?m)^' + re.escape(team_key) + r'=.*$',
                  lambda _: team_line,
                  block,
                  count=1
              )
          else:
              block = block.replace(
                  options_header,
                  options_header + "\n" + team_line,
                  1
              )

          export_key = "application/export_project_only"

          if re.search(r'(?m)^' + re.escape(export_key) + r'=.*$', block):
              block = re.sub(
                  r'(?m)^' + re.escape(export_key) + r'=.*$',
                  export_key + "=true",
                  block,
                  count=1
              )
          else:
              block += "\n" + export_key + "=true\n"

          s = s[:start_options] + block + s[next_section:]
          p.write_text(s)
          print("已设置 iOS 仅导出 Xcode 工程")
          PY

      - name: Install Godot
        run: |
          set -euo pipefail
          VERSION=4.4.1

          curl -fL --retry 3 -o /tmp/godot.zip \
            "https://github.com/godotengine/godot-builds/releases/download/${VERSION}-stable/Godot_v${VERSION}-stable_macos.universal.zip"

          mkdir -p /tmp/godotapp
          unzip -q /tmp/godot.zip -d /tmp/godotapp

          GODOT=$(find /tmp/godotapp -type f -path '*/Contents/MacOS/Godot' -print -quit)
          test -n "$GODOT"
          echo "GODOT=$GODOT" >> "$GITHUB_ENV"

          curl -fL --retry 3 -o /tmp/templates.tpz \
            "https://github.com/godotengine/godot-builds/releases/download/${VERSION}-stable/Godot_v${VERSION}-stable_export_templates.tpz"

          mkdir -p /tmp/templates
          mkdir -p "$HOME/Library/Application Support/Godot/export_templates/${VERSION}.stable"

          unzip -q /tmp/templates.tpz -d /tmp/templates

          cp -R /tmp/templates/templates/. \
            "$HOME/Library/Application Support/Godot/export_templates/${VERSION}.stable/"

      - name: Diagnose iOS export preset
        run: |
          set -euo pipefail
          echo "===== export_presets.cfg ====="
          test -f game/export_presets.cfg
          cat game/export_presets.cfg

      - name: Export iOS Xcode project
        run: |
          set -euo pipefail
          mkdir -p output/xcode

          "$GODOT" --headless --path game --editor --import --quit
          "$GODOT" --headless --path game --editor --quit

          set +e
          "$GODOT" --headless --verbose --path game \
            --export-release iOS "$PWD/output/xcode" \
            2>&1 | tee /tmp/godot-export.log
          STATUS=${PIPESTATUS[0]}
          set -e

          if [ "$STATUS" -ne 0 ]; then
            tail -n 200 /tmp/godot-export.log
            exit "$STATUS"
          fi

          echo "===== 导出目录 ====="
          find output/xcode -maxdepth 4 -print

          PROJECT=$(find output/xcode -name '*.xcodeproj' -type d -print -quit)
          if [ -z "$PROJECT" ]; then
            echo "ERROR: 未找到 Xcode 工程"
            exit 1
          fi

      - name: Compile unsigned IPA
        run: |
          set -euo pipefail

          PROJECT=$(find output/xcode -name '*.xcodeproj' -type d -print -quit)
          test -n "$PROJECT"
          export PROJECT

          SCHEME=$(python3 - <<'PY'
          import json, os, subprocess
          p = os.environ["PROJECT"]
          result = subprocess.check_output(
              ["xcodebuild", "-list", "-json", "-project", p],
              text=True
          )
          data = json.loads(result)["project"]
          schemes = data.get("schemes", [])
          print(schemes[0] if schemes else data["targets"][0])
          PY
          )

          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$PWD/output/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            DEVELOPMENT_TEAM='' \
            build

          APP=$(find output/DerivedData/Build/Products/Release-iphoneos \
            -maxdepth 1 -name '*.app' -type d -print -quit)
          test -n "$APP"

          mkdir -p output/Payload
          cp -R "$APP" output/Payload/

          cd output
          zip -qry Starsoil-unsigned.ipa Payload

      - name: Upload IPA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Starsoil-iOS-build
          path: |
            output/Starsoil-unsigned.ipa
            output/Starsoil-iOS.zip
          if-no-files-found: warn
